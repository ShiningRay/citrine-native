name: CI

# 核心包后端无关：全部测试跑 Memory 桩，不需要 GUI，ubuntu 即可。
# 各后端包（-libui / -gtk）的 CI 由它们自己的仓库负责（真控件路径）。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 开发期 Gemfile 用 `gem "citrine", path: "../citrine"`，两个仓库要同级
      - uses: actions/checkout@v7
        with:
          repository: ShiningRay/citrine
          path: citrine
      - uses: actions/checkout@v7
        with:
          path: citrine-native

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true
          working-directory: citrine-native

      - name: 单元测试（Memory 桩后端）
        working-directory: citrine-native
        run: bundle exec rake
